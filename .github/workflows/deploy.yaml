name: Build

on:
  push:
    branches:
      - 'workflow-test'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: ['windows-latest', 'ubuntu-latest', 'macos-latest']

    env:
      ENTRY_POINT: 'main.py'

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.13.x

    - name: Install project dependencies
      run: pip install -r requirements.txt

    - name: Install dev dependencies
      run: pip install -r dev-requirements.txt

    - name: Build executable
      run: pyinstaller --noconsole ${{ env.ENTRY_POINT }}

    # Note: the maintenance situation for auto-releasing is ugly. For now, download and verify
    # artifacts yourself and manually create a release.
    - name: ${{ matrix.os }} package
      uses: actions/upload-artifact@v4
      with:
        name: RentryArchiver-${{ env.GITHUB_REF_NAME }}-${{ matrix.os }}
        path: dist/
        if-no-files-found: error

    - name: Validate build
      run: ls -R dist